[project]
name = "clipfactory"
version = "1.0.0"
description = "Private, source-grounded news Clip production system"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2",
    "av>=11,<19",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "faster-whisper>=1,<2",
    "google-cloud-texttospeech>=2.16,<3",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "langgraph-checkpoint-postgres>=2,<4",
    "num2words>=0.5.14,<0.6",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
    "redis>=5,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
graphics-manim = ["manim==0.19.2"]
local-gen = [
    "accelerate>=1,<2",
    "diffusers>=0.33,<1",
    "ftfy>=6,<7",
    "torch>=2.6,<3",
    "transformers>=4.49,<5",
    "sentencepiece>=0.2,<1",
]

[dependency-groups]
graphics-manim = ["clipfactory[graphics-manim]"]
local-gen = ["clipfactory[local-gen]"]
dev = [
    "pyright>=1.1.380,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[project.scripts]
clipfactory = "clipfactory.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=clipfactory --cov-branch --cov-report=term-missing"
markers = [
    "req(identifier): requirement verified by this test",
    "unit: pure unit test",
    "integration: infrastructure integration test",
    "pipeline: full workflow test with fakes",
    "llm_contract: structured LLM contract test",
    "rendering: media rendering test",
    "failure_recovery: failure and resumption test",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["clipfactory"]
