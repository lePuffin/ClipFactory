[project]
name = "clipfactory"
version = "0.5.0"
description = "Local-first multi-source AI editorial selection and narrated rough-reel rendering."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chatterbox-tts>=0.1.7",
    "fastapi>=0.115,<1.0",
    "faster-whisper>=1.1,<2.0",
    "openai>=1.0,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pyttsx3>=2.99",
    "uvicorn[standard]>=0.30,<1.0",
    "yt-dlp>=2025.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
clipfactory = "app.main:run"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_tts: requires CLIPFACTORY_REAL_TTS=1 and a usable configured local provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
